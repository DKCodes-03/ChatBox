[alembic]
# Migration scripts live beside this file inside the backend image.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# env.py replaces this placeholder from file-mounted database credentials. Keeping credentials
# out of this tracked file prevents passwords from entering source control or image metadata.
sqlalchemy.url = postgresql+psycopg://

# Use deterministic, readable revision filenames and UTC timestamps for future migrations.
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 48
revision_environment = false
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
