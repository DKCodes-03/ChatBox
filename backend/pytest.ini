[pytest]
minversion = 8.3
testpaths = tests
pythonpath = .
addopts = -ra --strict-config --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    contract: verifies the public HTTP API contract
    integration: requires integrated application components or external test services
    slow: takes noticeably longer than the unit test suite

