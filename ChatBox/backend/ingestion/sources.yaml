manifest_version: 1

defaults:
  allowed_hosts:
    - pnw.edu
    - www.pnw.edu
  require_https: true
  review:
    required_before_activation: true
    default_status: pending_review
    default_cadence_days: 30
  follow_links:
    enabled: true
    allowed_content_types:
      - text/html
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document

sources:
  - id: pnw-academic-calendar
    title: PNW Academic Calendar
    url: https://www.pnw.edu/academic-calendar/
    source_type: webpage
    campus_scope: both
    academic_term: current
    owner: registrar
    reviewer: registrar-designated-reviewer
    review_status: pending_initial_review
    last_reviewed: null
    review_cadence_days: 30
    follow_links: true

  - id: pnw-registrar
    title: PNW Registrar
    url: https://www.pnw.edu/registrar/
    source_type: webpage
    campus_scope: both
    academic_term: current
    owner: registrar
    reviewer: registrar-designated-reviewer
    review_status: pending_initial_review
    last_reviewed: null
    review_cadence_days: 30
    follow_links: true

