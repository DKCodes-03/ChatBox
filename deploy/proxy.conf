# nginx runs as an unprivileged user with a read-only root filesystem. Runtime files go only to
# the memory-backed /tmp mount declared in compose.yaml.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Student request paths, IP addresses, cookies, and query strings must never enter access logs.
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's embedded DNS resolves the internal `api` service dynamically.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 16k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /healthz {
            access_log off;
            return 204;
        }

        location /api/ {
            access_log off;

            # A variable avoids resolving `api` while nginx validates its configuration. `$uri`
            # forwards the API path without a query string, preventing query data from propagating.
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream$uri;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header Set-Cookie;

            # Buffer the complete response for server-side validation; never cache chat content.
            proxy_buffering on;
            proxy_request_buffering on;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            proxy_connect_timeout 3s;
            proxy_send_timeout 12s;
            proxy_read_timeout 12s;

            # Location-level add_header directives replace inherited headers in nginx, so repeat
            # the server security headers wherever location-specific cache headers are set.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store, private" always;
            add_header Pragma "no-cache" always;
            expires off;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
            expires off;
        }
    }
}
